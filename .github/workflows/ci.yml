name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    name: quick checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests that take seconds
        run: mvn --batch-mode test
      - name: Hello World, the first command of the README
        run: mvn --batch-mode clean compile exec:java
      - name: The examples that take seconds, with the README commands
        shell: bash
        run: |
          for example in credit-card-fraud taxi-fare exam-pass light-switches spam-email sonar-mines iris-flower boston-housing cpu-performance auto-insurance sorting-algorithm; do
            echo "::group::$example"
            mvn --batch-mode -q clean compile exec:java -P$example
            echo "::endgroup::"
          done

  full:
    name: every example twice on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: All tests, including every example run twice (about 12 minutes)
        run: mvn --batch-mode test -Pall
